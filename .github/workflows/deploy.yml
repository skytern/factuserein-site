name: Validate and deploy website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-3
  FRONT_BUCKET: fs-front-826224348203
  CLOUDFRONT_DISTRIBUTION_ID: E1MT8TEKETHVQ2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check assets/js/main.js
      - name: Validate HTML, SEO, links, images and JSON-LD
        run: python3 scripts/validate_site.py
      - name: Validate required entry points
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/main.js
          test -f assets/img/hero-premium.webp
          test -f legal/cgv.html
          test -f scripts/validate_site.py

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::826224348203:role/FactuSereinGitHubActionsDeploy
      - name: Sync website to S3
        run: >-
          aws s3 sync . s3://${{ env.FRONT_BUCKET }}
          --region ${{ env.AWS_REGION }}
          --delete
          --exclude ".git/*"
          --exclude ".git/**"
          --exclude ".github/*"
          --exclude ".github/**"
          --exclude "docs/*"
          --exclude "kit-commercial/*"
          --exclude "kit-commercial/**"
          --exclude "scripts/*"
          --exclude "scripts/**"
          --exclude "download/*"
          --exclude "download/**"
          --exclude "updates/*"
          --exclude "updates/**"
          --exclude "*.md"
          --exclude ".git*"
          --exclude ".agents/*"
          --exclude ".agents/**"
      - name: Remove internal repository files from public bucket
        run: |
          aws s3 rm s3://${{ env.FRONT_BUCKET }}/kit-commercial/ --recursive --region ${{ env.AWS_REGION }}
          aws s3 rm s3://${{ env.FRONT_BUCKET }}/scripts/ --recursive --region ${{ env.AWS_REGION }}
          aws s3 rm s3://${{ env.FRONT_BUCKET }}/README.md --region ${{ env.AWS_REGION }}
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths '/*'
