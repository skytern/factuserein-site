name: Validate and deploy website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-3
  FRONT_BUCKET: fs-front-826224348203
  CLOUDFRONT_DISTRIBUTION_ID: E1MT8TEKETHVQ2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check assets/js/main.js
      - name: Validate required entry points
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/main.js
          test -f assets/img/hero-premium.webp

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: Sync website to S3
        run: >-
          aws s3 sync . s3://${{ env.FRONT_BUCKET }}
          --region ${{ env.AWS_REGION }}
          --delete
          --exclude ".git/*"
          --exclude ".git/**"
          --exclude ".github/*"
          --exclude ".github/**"
          --exclude "docs/*"
          --exclude ".agents/*"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths '/*'
